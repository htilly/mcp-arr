<title>MCP-ARR Sketchbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one sketchbook page — Claude in the middle, seven service cards orbiting it,
   TRaSH Guides tray at the bottom; tapping a card fills the notebook panel underneath. */
:root {
  --paper: #f4ead3;      /* sketchbook page */
  --paper-edge: #e6d6b2;
  --ink: #3b322a;        /* felt-tip pen */
  --ink-soft: #7a6b5b;
  --card: #efdfbd;       /* manila card */
  --clay: #d06c43;       /* arrows, TV, 4K */
  --clay-deep: #8f4425;
  --sea: #5f9e96;        /* brain, pill, 1080p */
  --sea-pale: #a8d4cb;
  --olive: #a3a372;      /* 720p */
  --check: #4f9e55;
  --steel: #b9b4aa;      /* reel, screen */
  --gold: #e3a979;
  --shadow: rgba(59, 50, 42, .14);
  --font-display: "Cabin Sketch", "Gaegu", "Comic Sans MS", cursive;
  --font-hand: "Gaegu", "Patrick Hand", "Comic Sans MS", cursive;
  --font-body: "Patrick Hand", "Gaegu", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #29251f; --paper-edge: #3a342b; --ink: #f1e6cf; --ink-soft: #b5a78f;
    --card: #3a3229; --clay: #e07f55; --clay-deep: #f2a07b; --sea: #78bab1; --sea-pale: #2f5752;
    --olive: #b7b783; --check: #79c47e; --steel: #6d685f; --gold: #c98c5e; --shadow: rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #29251f; --paper-edge: #3a342b; --ink: #f1e6cf; --ink-soft: #b5a78f;
  --card: #3a3229; --clay: #e07f55; --clay-deep: #f2a07b; --sea: #78bab1; --sea-pale: #2f5752;
  --olive: #b7b783; --check: #79c47e; --steel: #6d685f; --gold: #c98c5e; --shadow: rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper-edge);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.45;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  gap: 20px;
}
.sheet {
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 18px 22px 16px 24px / 22px 16px 24px 18px;
  box-shadow: 6px 7px 0 var(--shadow);
  overflow-x: auto;
}
svg.board { display: block; width: 100%; min-width: 760px; height: auto; }

/* svg type */
.t-title { font-family: var(--font-display); font-size: 68px; fill: var(--ink); letter-spacing: 1px; }
.t-sub   { font-family: var(--font-hand); font-weight: 700; font-size: 30px; fill: var(--ink); }
.t-kind  { font-family: var(--font-hand); font-weight: 700; font-size: 27px; fill: var(--ink); }
.t-name  { font-family: var(--font-body); font-size: 30px; fill: var(--ink); }
.t-small { font-family: var(--font-hand); font-weight: 700; font-size: 20px; fill: var(--ink); }
.t-tiny  { font-family: var(--font-hand); font-weight: 700; font-size: 15px; fill: var(--ink); }
.t-badge { font-family: var(--font-hand); font-weight: 700; font-size: 34px; fill: var(--ink); }

.ink   { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.thin  { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.f-paper { fill: var(--paper); } .f-card { fill: var(--card); } .f-clay { fill: var(--clay); }
.f-sea { fill: var(--sea); } .f-sea-pale { fill: var(--sea-pale); } .f-olive { fill: var(--olive); }
.f-steel { fill: var(--steel); } .f-gold { fill: var(--gold); } .f-ink { fill: var(--ink); } .f-none { fill: none; }
.f-check { fill: none; stroke: var(--check); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.hatch-line { stroke: var(--ink); stroke-width: 1.3; opacity: .35; }

/* arrows */
.arrow .shaft-o { stroke: var(--clay-deep); stroke-width: 17; stroke-linecap: round; fill: none; }
.arrow .shaft   { stroke: var(--clay); stroke-width: 11; stroke-linecap: round; fill: none; }
.arrow .head    { fill: var(--clay); stroke: var(--clay-deep); stroke-width: 3; stroke-linejoin: round; }
.arrow { transition: opacity .25s ease; }
.board.focus .arrow { opacity: .28; }
.board.focus .arrow.on { opacity: 1; }

/* service nodes */
.node { cursor: pointer; outline: none; }
.node .card { transition: transform .2s ease; transform-box: fill-box; transform-origin: center; }
.node:hover .card, .node:focus-visible .card, .node.on .card { fill: var(--sea-pale); }
.node:focus-visible .focus-ring { stroke: var(--sea); stroke-width: 4; stroke-dasharray: 8 6; fill: none; }
.focus-ring { stroke: none; fill: none; }

/* one orchestrated moment: arrows draw outward from Claude */
@media (prefers-reduced-motion: no-preference) {
  .arrow path.shaft, .arrow path.shaft-o { stroke-dasharray: 400; animation: draw 0.9s cubic-bezier(.6,.1,.3,1) both; }
  .arrow .head { animation: pop .3s ease both; }
  .arrow:nth-of-type(2) * { animation-delay: .08s; } .arrow:nth-of-type(3) * { animation-delay: .16s; }
  .arrow:nth-of-type(4) * { animation-delay: .24s; } .arrow:nth-of-type(5) * { animation-delay: .32s; }
  .arrow:nth-of-type(6) * { animation-delay: .40s; } .arrow:nth-of-type(7) * { animation-delay: .48s; }
  .arrow .head { animation-delay: .75s !important; }
  .needle { animation: sweep 1.6s .6s cubic-bezier(.3,1.6,.5,1) both; transform-origin: 0 0; }
}
@keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
@keyframes pop  { from { opacity: 0; } to { opacity: 1; } }
@keyframes sweep { from { transform: rotate(-80deg); } to { transform: rotate(18deg); } }

/* notebook panel */
.notes {
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 20px 14px 22px 16px / 14px 22px 16px 20px;
  box-shadow: 5px 6px 0 var(--shadow);
  padding: 22px 26px 26px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 33px, color-mix(in srgb, var(--sea) 22%, transparent) 33px 34px);
  background-position: 0 14px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  gap: 8px 40px;
}
.notes h2 { font-family: var(--font-display); font-size: 40px; line-height: 1.1; margin: 0; text-wrap: balance; }
.notes .what { font-family: var(--font-hand); font-weight: 700; font-size: 22px; color: var(--ink-soft); margin: 4px 0 10px; }
.notes p { margin: 0 0 12px; max-width: 60ch; }
.prompt {
  font-family: var(--font-hand); font-size: 23px; font-weight: 700;
  background: var(--sea-pale); border: 2px solid var(--sea);
  border-radius: 14px 18px 12px 20px; padding: 10px 16px; margin: 6px 0 0; display: inline-block;
}
.tools-h { font-family: var(--font-hand); font-weight: 700; font-size: 22px; margin: 0 0 6px; }
.tools { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 10px; }
.tools li {
  font-family: var(--font-body); font-size: 17px;
  border: 2px solid var(--ink); border-radius: 10px 14px 9px 13px;
  background: var(--card); padding: 2px 10px;
  overflow-wrap: anywhere;
}
.hint { font-family: var(--font-hand); font-weight: 700; font-size: 20px; color: var(--ink-soft); text-align: center; margin: 0; }

@media (max-width: 760px) {
  .notes { grid-template-columns: 1fr; padding: 18px; }
  .notes h2 { font-size: 34px; }
  .hint::before { content: "Swipe the sketch sideways to see it all. "; }
}
</style>

          <path d="M-18 -80 A 82 82 0 1 0 -18 80 M-18 -44 A 46 46 0 1 0 -18 44" class="thin" opacity=".8"/>
          <!-- brain -->

            <path class="ink f-sea" d="M8 -58 C30 -66 52 -52 50 -34 C70 -30 72 -6 60 4 C74 18 62 42 42 42 C38 60 16 64 8 52 Z"/>

            <path class="thin" d="M16 -44 C32 -40 26 -22 40 -18 M48 4 C30 0 34 18 18 20 M36 32 C26 24 16 34 12 26 M22 -8 C14 -14 14 -2 12 4"/>
            <path class="thin" d="M4 -56 L4 50" opacity=".6"/>
          </g>
          <text x="0" y="122" text-anchor="middle" class="t-sub" style="font-size:34px">Claude</text>
          <rect x="-150" y="138" width="300" height="46" rx="12" class="ink f-sea-pale" style="stroke:var(--sea)"/>
          <text x="0" y="170" text-anchor="middle" class="t-small" style="font-size:23px">Natural language control</text>
        </g>

        <!-- NODES -->
        <g id="nodes"></g>

        <!-- TRaSH tray -->
        <g transform="translate(470 650)">
          <rect x="0" y="0" width="460" height="180" rx="14" class="ink f-paper"/>
          <rect x="6" y="6" width="448" height="168" rx="11" class="thin" opacity=".35"/>
          <text x="230" y="38" text-anchor="middle" class="t-kind">TRaSH Guides built in</text>
          <g id="seals" transform="translate(0 106)"></g>

    </svg>
  </div>

  <section class="notes" id="notes" aria-live="polite">

      <h2 id="n-name">Radarr</h2>

      desc: "See who is watching right now, what was watched and when, and what was recently added to Plex.",
      prompt: "“Has anyone watched The Bear this month?”",
      tools: ["tautulli_get_activity","tautulli_get_history","tautulli_get_libraries","tautulli_get_server_info","tautulli_get_home_stats","tautulli_get_users","tautulli_get_recently_added","tautulli_server_status","tautulli_terminate_session"] },
    { id: "overseerr", name: "Overseerr", kind: "Requests", icon: "ticket", x: 1100, y: 715, side: "right",
      desc: "Review what family and friends have asked for, then approve or decline each request.",
      prompt: "“Approve all pending movie requests from Anna.”",
      tools: ["overseerr_get_requests","overseerr_get_request_count","overseerr_get_users","overseerr_get_user_requests","overseerr_approve_request","overseerr_decline_request","overseerr_search","overseerr_status"] },
  ];

  const board = document.getElementById("board");
  const arrowsG = document.getElementById("arrows");
  const nodesG = document.getElementById("nodes");
  const HUB = { x: 700, y: 410 };

  /* card geometry: card 210x78, icon sits outboard of the card */
  const CW = 210, CH = 78;
  function layout(s) {
    if (s.side === "top")   return { cx: s.x + 70, cy: s.y, ix: s.x - 120, iy: s.y - 10, end: { x: s.x, y: s.y + CH / 2 + 22 } };
    if (s.side === "left")  return { cx: s.x, cy: s.y, ix: s.x - 185, iy: s.y - 6, end: { x: s.x + CW / 2 + 24, y: s.y } };
    return                         { cx: s.x, cy: s.y, ix: s.x + 182, iy: s.y - 6, end: { x: s.x - CW / 2 - 24, y: s.y } };
  }

  function arrow(from, to, both) {
    const g = el("g", { class: "arrow" }, arrowsG);
    const dx = to.x - from.x, dy = to.y - from.y, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
    const bend = 10 * (from.x < to.x ? 1 : -1);
    const mx = (from.x + to.x) / 2 + nx * bend, my = (from.y + to.y) / 2 + ny * bend;
    const tip = { x: to.x, y: to.y }, base = { x: to.x - ux * 30, y: to.y - uy * 30 };
    const d = `M${from.x + ux * 8} ${from.y + uy * 8} Q${mx} ${my} ${base.x} ${base.y}`;
    el("path", { d, class: "shaft-o" }, g);
    el("path", { d, class: "shaft" }, g);
    const head = (t, b) => el("path", { class: "head",
      d: `M${t.x} ${t.y} L${b.x + nx * 22 * Math.sign(1)} ${b.y + ny * 22} L${b.x - nx * 22} ${b.y - ny * 22} Z` }, g);
    head(tip, base);
    if (both) {
      const t2 = { x: from.x, y: from.y }, b2 = { x: from.x + ux * 30, y: from.y + uy * 30 };
      el("path", { class: "head", d: `M${t2.x} ${t2.y} L${b2.x + nx * 22} ${b2.y + ny * 22} L${b2.x - nx * 22} ${b2.y - ny * 22} Z` }, g);
    }
    return g;
  }

  // arrows start at the hub's rim, pointing outwards
  SERVICES.forEach((s) => {
    const L = layout(s);
    const dx = L.end.x - HUB.x, dy = L.end.y - HUB.y, len = Math.hypot(dx, dy);
    const rim = s.side === "top" ? 92 : 120;
    const start = { x: HUB.x + 30 + (dx / len) * rim, y: HUB.y + (dy / len) * rim * 0.85 };
    s.arrow = arrow(start, L.end, s.side === "top");
  });

  SERVICES.forEach((s) => {
    const L = layout(s);
    const g = el("g", { class: "node", tabindex: "0", role: "button", "aria-label": `${s.name}, ${s.kind}. Show tools.`, "data-id": s.id }, nodesG);
    const icon = el("g", { transform: `translate(${L.ix} ${L.iy}) scale(.92)` }, g);
    icon.appendChild(html(ICONS[s.icon]));
    el("rect", { x: L.cx - CW / 2 - 8, y: L.cy - CH / 2 - 48, width: CW + 16, height: CH + 58, rx: 16, class: "focus-ring" }, g);
    el("rect", { x: L.cx - CW / 2, y: L.cy - CH / 2, width: CW, height: CH, rx: 12, class: "card ink f-card" }, g);
    el("rect", { x: L.cx - CW / 2 + 5, y: L.cy - CH / 2 + 5, width: CW - 10, height: CH - 10, rx: 9, class: "thin", opacity: ".3" }, g);
    const kind = el("text", { x: L.cx - CW / 2 + 6, y: L.cy - CH / 2 - 12, class: "t-kind" }, g);
    kind.textContent = s.kind;
    el("text", { x: L.cx, y: L.cy + 10, "text-anchor": "middle", class: "t-name" }, g).textContent = s.name;
    // check mark after the kind label
    const w = s.kind.length * 12.5 + 14;
    el("use", { href: "#check", x: L.cx - CW / 2 + 6 + w, y: L.cy - CH / 2 - 42, width: 36, height: 36 }, g);
    s.node = g;
  });

  /* ---------- rosettes & seals ---------- */
  function rosette(parent, cx, cy, r, fill, lines, ribbon) {
    const g = el("g", { transform: `translate(${cx} ${cy})` }, parent);
    if (ribbon) {
      el("path", { class: "ink", fill, d: `M-26 ${r - 10} L-44 ${r + 46} L-28 ${r + 36} L-16 ${r + 50} L-4 ${r - 4} Z` }, g);
      el("path", { class: "ink", fill, d: `M26 ${r - 10} L44 ${r + 46} L28 ${r + 36} L16 ${r + 50} L4 ${r - 4} Z` }, g);
      el("path", { fill: "url(#hatch)", d: `M-26 ${r - 10} L-44 ${r + 46} L-28 ${r + 36} L-16 ${r + 50} L-4 ${r - 4} Z M26 ${r - 10} L44 ${r + 46} L28 ${r + 36} L16 ${r + 50} L4 ${r - 4} Z` }, g);
    }
    const pts = [];
    const n = 22;
    for (let i = 0; i < n * 2; i++) {
      const a = (Math.PI * i) / n, rr = i % 2 ? r * 0.88 : r;
      pts.push(`${(Math.cos(a) * rr).toFixed(1)},${(Math.sin(a) * rr).toFixed(1)}`);
    }
    el("polygon", { points: pts.join(" "), class: "ink", fill }, g);
    el("circle", { r: r * 0.74, class: "ink f-paper" }, g);
    el("circle", { r: r * 0.66, class: "thin", "stroke-dasharray": "2 6", opacity: ".6" }, g);
    lines.forEach((ln, i) => {
      const t = el("text", { y: ln.y, "text-anchor": "middle", class: ln.cls }, g);
      t.textContent = ln.t;
    });
    return g;
  }
  const ros = document.getElementById("rosettes");
  const toolCount = SERVICES.reduce((a, s) => a + s.tools.length, 0) + 11; // + TRaSH (7), arr_status, arr_search_all, search, fetch
  rosette(ros, 1120, 92, 56, "var(--gold)", [{ t: `${toolCount}`, y: -2, cls: "t-badge" }, { t: "tools", y: 24, cls: "t-tiny" }], true);
  rosette(ros, 1262, 92, 56, "var(--sea)", [{ t: "7", y: -2, cls: "t-badge" }, { t: "services", y: 24, cls: "t-tiny" }], true);

  const seals = document.getElementById("seals");
  rosette(seals, 60, -10, 44, "var(--clay)", [{ t: "4K", y: 10, cls: "t-badge" }]);
  rosette(seals, 158, -10, 44, "var(--sea)", [{ t: "1080p", y: 8, cls: "t-small" }]);
  rosette(seals, 256, -10, 44, "var(--olive)", [{ t: "720p", y: 8, cls: "t-small" }]);
  seals.querySelectorAll(".t-badge").forEach((t) => t.style.fontSize = "30px");

  /* ---------- interaction ---------- */
  const $ = (id) => document.getElementById(id);
  function show(s) {
    SERVICES.forEach((o) => { o.node.classList.toggle("on", o === s); o.arrow.classList.toggle("on", o === s); });
    board.classList.add("focus");
    $("n-name").textContent = s.name;
    $("n-what").textContent = s.kind;
    $("n-desc").textContent = s.desc;
    $("n-prompt").textContent = s.prompt;
    $("n-count").textContent = `${s.tools.length} tools`;
    const ul = $("n-tools"); ul.replaceChildren();
    s.tools.forEach((t) => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
  }
  SERVICES.forEach((s) => {
    s.node.addEventListener("click", () => show(s));
    s.node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(s); } });
  });
  // start with Radarr open so the panel is never empty, without dimming the sketch
  show(SERVICES[0]);
  board.classList.remove("focus");
  SERVICES[0].node.classList.remove("on"); SERVICES[0].arrow.classList.remove("on");
})();
</script>
