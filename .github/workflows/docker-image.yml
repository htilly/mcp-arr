name: Build and Push Docker Image

# Builds the image on a GitHub-hosted runner and pushes it to ghcr.io. The
# deploy to tillyse (deploy.yml) pulls the sha-pinned tag this workflow pushes;
# nothing is ever built on the server.
#
# This repo is PUBLIC, so the build deliberately does not run on the
# self-hosted runner: a fork PR must never be able to run code on tillyse.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mcp-arr

jobs:
  build:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Enough to push to ghcr.io for this repo. GITHUB_TOKEN is created per
      # run, so no PAT has to be created or stored.
      packages: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # linux/amd64 only: ubuntu-latest is amd64 and tillyse is x86_64.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Determine Docker tags
        id: docker_tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # ghcr requires a lowercase image name.
          IMAGE="ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}"
          echo "tags=${IMAGE}:main,${IMAGE}:main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Links the ghcr package to this repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
